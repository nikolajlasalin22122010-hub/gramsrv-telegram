name: Build DaskGram APK

# Builds the Android client on GitHub-hosted runners so the production VDS is
# never touched. arm64-v8a only: that covers every phone that matters and keeps
# the NDK step to a fraction of a four-ABI build.

on:
  workflow_dispatch:
  push:
    branches:
      - flashcall/dial-client

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Reclaim disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator || true
          echo "after:"; df -h / | tail -1

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug \
            -PdaskAbi=arm64-v8a \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: List APKs
        if: always()
        run: |
          find . -name '*.apk' -not -path '*/intermediates/*' -printf '%p  %k KB\n' || true
          df -h / | tail -1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daskgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
